name: Container CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Test, build, and smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6 # v6
        with:
          node-version: '24'
      - name: Test clock function
        run: npm test
      - name: Build container
        run: docker build --platform linux/amd64 --tag hello-world:ci .
      - name: Check HTTP response
        shell: bash
        run: |
          container=$(docker run --detach --publish 127.0.0.1::80 hello-world:ci)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          endpoint=$(docker port "$container" 80/tcp)
          response=$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 5 "http://$endpoint/")
          grep -Fx '      <h1>Local Clock</h1>' <<< "$response"
          curl --fail --silent --show-error --max-time 5 "http://$endpoint/clock.js" \
            | grep -F 'export function formatTime(date)'
      - name: Save tested image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: docker save --output "$RUNNER_TEMP/hello-world.tar" hello-world:ci
      - uses: actions/upload-artifact@v6 # v6.0.0
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: hello-world-image
          path: ${{ runner.temp }}/hello-world.tar
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy to Azure Container Apps
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: azure-container-app
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7 # v7.0.0
        with:
          name: hello-world-image
          path: ${{ runner.temp }}
      - uses: azure/login@v3 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push image and update container app
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          image="${ACR_LOGIN_SERVER:?}/hello-world:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker load --input "$RUNNER_TEMP/hello-world.tar"
          az acr login --name "${ACR_NAME:?}"
          docker tag hello-world:ci "$image"
          docker push "$image"
          az containerapp update --resource-group "${AZURE_RESOURCE_GROUP:?}" \
            --name "${AZURE_CONTAINER_APP:?}" --image "$image"
